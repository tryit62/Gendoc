<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur documentaire — Ordre</title><style>
:root{--bg:#0b0d0c;--panel:#141715;--line:#353a36;--ink:#eceeea;--muted:#969d97;--paper:#f5f4ef;--black:#111}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Courier New,Courier,monospace}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.top b{letter-spacing:.08em}.top span{color:var(--muted);font-size:12px}.app{display:grid;grid-template-columns:minmax(330px,430px) 1fr;min-height:calc(100vh - 62px)}aside{padding:18px;border-right:1px solid var(--line);overflow:auto}main{padding:22px;overflow:auto}.group{border:1px solid var(--line);padding:14px;margin-bottom:14px;background:var(--panel)}h2{font-size:12px;letter-spacing:.12em;margin:0 0 12px}label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0e100f;color:var(--ink);border:1px solid #414742;padding:9px;border-radius:0}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px}.checks label{margin:0;color:var(--ink);display:flex;gap:7px;align-items:center}.checks input{width:auto}.btns{display:flex;flex-wrap:wrap;gap:7px}.btns button{background:#1d211e;color:var(--ink);border:1px solid #4a504b;padding:9px 11px;cursor:pointer}.status{font-size:11px;padding:10px;border:1px solid #4a504b;margin-bottom:12px}.paper{width:210mm;min-height:297mm;margin:auto;background:var(--paper);color:var(--black);padding:18mm 18mm 16mm;box-shadow:0 10px 40px #000;font-family:Courier New,Courier,monospace;position:relative}.dochead{border-bottom:1px solid #999;padding-bottom:9px;margin-bottom:15px}.ref{font-weight:bold;font-size:12px}.org{font-size:10px;margin-top:4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:9px;margin:14px 0 18px}.meta div{border-bottom:1px dotted #bbb;padding:3px 0}.title{font-weight:bold;font-size:15px;margin:18px 0 12px}.body{font-size:10px;line-height:1.55;white-space:pre-wrap}.foot{position:absolute;left:18mm;right:18mm;bottom:10mm;border-top:1px solid #aaa;padding-top:5px;font-size:8px;display:flex;justify-content:space-between}.seal{float:right;border:2px solid #222;padding:8px;font-size:8px;margin:0 0 10px 10px}.warn{color:#d7b86a}@media(max-width:1000px){.app{grid-template-columns:1fr}.paper{transform-origin:top left;max-width:100%;width:100%;min-height:900px}.foot{position:absolute}aside{border-right:0;border-bottom:1px solid var(--line)}}@media print{body{background:white}.top,aside,.status{display:none!important}.app{display:block}.paper{box-shadow:none;margin:0;width:210mm;min-height:297mm}.paper{page-break-after:always}main{padding:0}}
</style></head><body><div class="top"><div><b>GÉNÉRATEUR DOCUMENTAIRE</b><br><span>L'ORDRE DES CINQ OMBRES // CHARTE V1</span></div><span>OUTIL AUTEUR</span></div><div class="app"><aside>
<div class="group"><h2>01 // IDENTIFICATION</h2><div class="row"><div><label>Dossier</label><input id="dossier" value="D001"></div><div><label>N° de pièce</label><input id="num" value="01" maxlength="2"></div></div><label>Catégorie</label><select id="cat"><option value="M">M — Mission / ordre de mission</option><option value="D">D — Document / pièce documentaire</option><option value="P">P — Photographie / plan / relevé</option><option value="T" selected>T — Témoignage / audition / transcription</option><option value="O">O — Objet / pièce physique</option><option value="A">A — Anomalie / enregistrement</option><option value="R">R — Recrutement / administratif</option><option value="X">X — Pièce non qualifiée</option></select><label>Intitulé du document</label><input id="doctype" value="PROCÈS-VERBAL D'AUDITION"></div>
<div class="group"><h2>02 // CLASSIFICATION</h2><label>Accréditation</label><select id="access"><option>NON CLASSIFIÉ</option><option selected>OMBRE I</option><option>OMBRE II</option><option>OMBRE III</option><option>ACCÈS REFUSÉ</option></select><label>Diffusion</label><select id="diff"><option value="">— aucune —</option><option>DIFFUSION INTERNE</option><option selected>DIFFUSION RESTREINTE</option><option>NON CLASSIFIÉ</option></select><label>Mode</label><select id="mode"><option value="canon">MODE CANON</option><option value="custom">MODE PERSONNALISÉ</option></select></div>
<div class="group"><h2>03 // MÉTADONNÉES</h2><div class="checks" id="metachecks"></div><div id="metafields"></div></div>
<div class="group"><h2>04 // CONTENU</h2><label>Titre interne</label><input id="title" value="AUDITION — CLAIRE VARENNE"><label>Corps du document</label><textarea id="body">[Saisissez ici le texte du document.]</textarea><label>Sceau</label><select id="seal"><option value="">Aucun</option><option>ŒIL FENDU</option><option>FLAMME INVERSÉE</option><option>MAIN CASSÉE</option><option>SPIRALE D'OS</option><option>SABLIER NOIR</option><option>ORDRE</option></select><div class="btns" style="margin-top:10px"><button data-ins="[INFORMATION RETIRÉE]">+ INFO RETIRÉE</button><button data-ins="[ACCÈS OMBRE II REQUIS]">+ ACCÈS OII</button><button data-ins="████████████">+ BARRE NOIRE</button></div></div>
<div class="group"><h2>05 // SORTIE</h2><div class="btns"><button onclick="window.print()">IMPRIMER / PDF</button><button id="save">SAUVEGARDER BROUILLON</button><button id="reset">RÉINITIALISER</button></div></div>
</aside><main><div class="status" id="status">CONFORMITÉ CHARTE : 100 % // MODE CANON</div><section class="paper" id="paper"><div class="dochead"><div class="ref" id="pvref"></div><div class="org">ORDRE DES CINQ OMBRES</div></div><div id="pvseal"></div><div class="meta" id="pvmeta"></div><div class="title" id="pvtitle"></div><div class="body" id="pvbody"></div><div class="foot"><span id="pvfoot"></span><span>1 / 1</span></div></section></main></div>
<script>
const defs={
M:['DOCUMENT','DOSSIER','DESTINATAIRE','STATUT','ACCRÉDITATION'],D:['DOCUMENT','DOSSIER','TYPE','SUJET','DATE','AUTEUR / SERVICE'],P:['DOCUMENT','DOSSIER','TYPE','SUJET','DATE','HEURE','LIEU','AUTEUR / SERVICE'],T:['DOCUMENT','DOSSIER','TYPE','SUJET','DATE','HEURE','LIEU','AUTEUR / SERVICE'],O:['DOCUMENT','DOSSIER','TYPE','SUJET','STATUT','PIÈCES ASSOCIÉES'],A:['DOCUMENT','DOSSIER','TYPE','SUJET','DATE','HEURE','LIEU','STATUT','ACCRÉDITATION','DIFFUSION','AUTEUR / SERVICE','PIÈCES ASSOCIÉES'],R:['DOCUMENT','TYPE','DESTINATAIRE','SUJET','DATE','STATUT','ACCRÉDITATION','DIFFUSION','AUTEUR / SERVICE'],X:['DOCUMENT','DOSSIER','SUJET','STATUT','ACCRÉDITATION','DIFFUSION','PIÈCES ASSOCIÉES']};
const all=['DOCUMENT','DOSSIER','TYPE','DESTINATAIRE','SUJET','DATE','HEURE','LIEU','STATUT','ACCRÉDITATION','DIFFUSION','AUTEUR / SERVICE','PIÈCES ASSOCIÉES'];
const values={'DESTINATAIRE':'INITIÉ','SUJET':'CLAIRE VARENNE','DATE':'03.02.2026','HEURE':'16:47','LIEU':'','STATUT':'ACTIF','AUTEUR / SERVICE':'','PIÈCES ASSOCIÉES':''};
const $=id=>document.getElementById(id);function ref(){return `${$('dossier').value.trim()}/${$('cat').value}${$('num').value.padStart(2,'0')}`}
function buildMeta(){let c=$('metachecks'),f=$('metafields');c.innerHTML='';f.innerHTML='';all.forEach(k=>{let lab=document.createElement('label'),ch=document.createElement('input');ch.type='checkbox';ch.dataset.key=k;ch.checked=defs[$('cat').value].includes(k);ch.onchange=render;lab.append(ch,document.createTextNode(k));c.append(lab);let wrap=document.createElement('div');wrap.dataset.field=k;let l=document.createElement('label');l.textContent=k;let i=document.createElement('input');i.dataset.input=k;i.value=values[k]||'';i.oninput=render;wrap.append(l,i);f.append(wrap)});render()}
function render(){let r=ref(),cat=$('cat').value,access=$('access').value,diff=$('diff').value;$('pvref').textContent=`${r} // ${$('doctype').value}`;$('pvtitle').textContent=$('title').value;$('pvbody').textContent=$('body').value;$('pvfoot').textContent=`${r} // ${access==='NON CLASSIFIÉ'?'NON CLASSIFIÉ':'ACCÈS '+access}`;let m=$('pvmeta');m.innerHTML='';document.querySelectorAll('#metachecks input').forEach(ch=>{let field=document.querySelector(`[data-field="${ch.dataset.key}"]`);field.style.display=ch.checked?'block':'none';if(!ch.checked)return;let k=ch.dataset.key,v='';if(k==='DOCUMENT')v=r;else if(k==='DOSSIER')v=$('dossier').value;else if(k==='TYPE')v=$('doctype').value;else if(k==='ACCRÉDITATION')v=access;else if(k==='DIFFUSION')v=diff;else v=document.querySelector(`[data-input="${k}"]`).value;if(v){let d=document.createElement('div');d.textContent=`${k} : ${v}`;m.append(d)}});let s=$('seal').value;$('pvseal').innerHTML=s?`<div class="seal">SCEAU // ${s}</div>`:'';let custom=$('mode').value==='custom';$('status').innerHTML=custom?'<span class="warn">MODE PERSONNALISÉ // DÉROGATIONS AUTORISÉES</span>':'CONFORMITÉ CHARTE : 100 % // MODE CANON'}
['dossier','num','cat','doctype','access','diff','mode','title','body','seal'].forEach(id=>$(id).addEventListener(id==='body'?'input':'change',()=>{if(id==='cat')buildMeta();else render()}));
document.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{let t=$('body'),p=t.selectionStart;t.value=t.value.slice(0,p)+b.dataset.ins+t.value.slice(t.selectionEnd);t.focus();t.selectionStart=t.selectionEnd=p+b.dataset.ins.length;render()});
$('save').onclick=()=>{let data={};document.querySelectorAll('input,select,textarea').forEach(x=>{if(x.id)data[x.id]=x.value});localStorage.setItem('ordreDocDraft',JSON.stringify(data));alert('Brouillon sauvegardé sur cet appareil.')};
$('reset').onclick=()=>{if(confirm('Réinitialiser le générateur ?')){localStorage.removeItem('ordreDocDraft');location.reload()}};
let saved=localStorage.getItem('ordreDocDraft');if(saved){try{let d=JSON.parse(saved);Object.entries(d).forEach(([k,v])=>{if($(k))$(k).value=v})}catch(e){}}buildMeta();
</script></body></html>
